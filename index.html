<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">

    <link rel="manifest" href="./manifest.json">

    <title>MyTube</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>MyTube</h1>

        <button onclick="abrirYouTube()">
            Abrir YouTube
        </button>

    </div>

    <script>
        function abrirYouTube() {
            window.location.href = "https://m.youtube.com/";
        }
    </script>

</body>
</html>
